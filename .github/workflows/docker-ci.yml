name: Validar exercícios docker

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  validate-docker:
    name: Build e validação dos containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Validar exercício 1 (hello container)
        run: |
          cd docker/exercicio-1
          docker compose build
          docker compose up -d
          sleep 5
          curl -f http://localhost:3000
          docker compose down

      - name: Validar exercício 2 (API + DB)
        run: |
          cd docker/exercicio-2
          docker compose build
          docker compose up -d
          sleep 10
          curl -f http://localhost:3000/health
          docker compose down -v

      - name: Validar exercício 3 (dev e prod)
        run: |
          cd docker/exercicio-3
          # Teste Dev
          docker compose -f docker-compose.dev.yml build
          docker compose -f docker-compose.dev.yml up -d
          sleep 10
          curl -f http://localhost:3000/health
          docker compose -f docker-compose.dev.yml down -v

          # Teste Prod
          docker compose -f docker-compose.prod.yml build
          docker compose -f docker-compose.prod.yml up -d
          sleep 10
          curl -f http://localhost:3000/health
          docker compose -f docker-compose.prod.yml down -v

      - name: Validar desafio extra (API + DB + Adminer)
        run: |
          cd docker/exercicio-extra
          docker compose build
          docker compose up -d
          sleep 10
          curl -f http://localhost:3000/health
          docker compose down -v
