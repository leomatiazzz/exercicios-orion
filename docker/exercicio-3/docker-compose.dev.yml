services:
  db:
    image: postgres:15-alpine
    container_name: exercicio-3-db-dev
    restart: always
    env_file:
      - .env.dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dev-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: exercicio-3-api-dev
    restart: always
    env_file:
      - .env.dev
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dev-network

volumes:
  postgres_data_dev:
    driver: local

networks:
  dev-network:
    driver: bridge

