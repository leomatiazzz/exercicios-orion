services:
  db:
    image: postgres:15-alpine
    container_name: extra-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stack-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: extra-api
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./api:/app
      - /app/node_modules
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      PORT: ${PORT:-3000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - stack-network

  adminer:
    image: adminer:latest
    container_name: extra-adminer
    restart: always
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - stack-network

volumes:
  postgres_data:
    driver: local

networks:
  stack-network:
    driver: bridge
